<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Contacto - Café Aroma</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f1ea; color: #333; margin: 0; padding: 20px;">

    <nav style="background-color: #4a2c2a; padding: 15px; border-radius: 5px;">
        <a href="index.html" style="color: #ffffff; text-decoration: none; margin-right: 15px; font-weight: bold;">Inicio</a>
        <a href="about.html" style="color: #ffffff; text-decoration: none; margin-right: 15px; font-weight: bold;">Sobre Nosotros</a>
        <a href="contact.html" style="color: #ffffff; text-decoration: none; font-weight: bold;">Contacto</a>
    </nav>

    <main style="margin-top: 30px;">
        <h1 style="color: #4a2c2a;">Ponte en Contacto</h1>
        <form style="background-color: #ffffff; padding: 20px; border-radius: 5px; max-width: 400px;">
            <label style="display: block; margin-bottom: 5px; font-weight: bold;">Nombre:</label>
            <input type="text" style="width: 100%; padding: 8px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">

            <label style="display: block; margin-bottom: 5px; font-weight: bold;">Correo Electrónico:</label>
            <input type="email" style="width: 100%; padding: 8px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">

            <label style="display: block; margin-bottom: 5px; font-weight: bold;">Mensaje:</label>
            <textarea rows="4" style="width: 100%; padding: 8px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;"></textarea>

            <button type="submit" style="background-color: #4a2c2a; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer;">Enviar</button>
        </form>
    </main>

</body>
</html>
